name: Build Taskly Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/taskly-reliability-upgrade
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
      - 'frontend/public/icons/**'
      - 'frontend/public/taskly-version.json'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android shell dependencies
        working-directory: mobile
        run: npm install --no-package-lock

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Register native Taskly plugins
        working-directory: mobile
        run: npx cap sync android

      - name: Set Android app version
        shell: bash
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 2/' mobile/android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "1.1.0"/' mobile/android/app/build.gradle

      - name: Apply Taskly app icon
        shell: bash
        run: |
          for dir in mobile/android/app/src/main/res/mipmap-*dpi; do
            cp frontend/public/icons/icon-512.png "$dir/ic_launcher.png"
            cp frontend/public/icons/icon-512.png "$dir/ic_launcher_round.png"
            cp frontend/public/icons/icon-512-maskable.png "$dir/ic_launcher_foreground.png" || true
          done

      - name: Build installable Android APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Taskly-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taskly-Android-APK
          path: Taskly-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete taskly-latest --cleanup-tag -y || true
          gh release create taskly-latest Taskly-Android.apk \
            --target "$GITHUB_SHA" \
            --title "Taskly Android 1.1.0" \
            --notes "Taskly 1.1.0 adds smarter execution planning, native reminders, weekly review, offline execution caching, Focus access, smart rescheduling, and in-app update checks."
