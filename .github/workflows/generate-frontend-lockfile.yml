name: Generate frontend npm lockfile

on:
  push:
    branches:
      - feature/taskly-full-translation
    paths:
      - .github/workflows/generate-frontend-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taskly-full-translation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate frontend lockfile from package manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build React frontend and validate TypeScript
        working-directory: frontend
        run: npm run build
      - name: Commit generated lockfile to translation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(frontend): add reproducible npm lockfile for Cloudflare builds"
            git push origin HEAD:feature/taskly-full-translation
          fi
