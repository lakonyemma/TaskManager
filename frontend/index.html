<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/notification-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e27" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#8B5CF6" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Taskly — a premium task and team management platform." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Taskly" />
    <title>Taskly</title>
    <script>
      // Applied synchronously, before first paint, so a reload never
      // flashes the default purple theme while /api/auth/me is in flight —
      // AuthContext keeps this in sync with the signed-in user's saved
      // preference (see AuthContext.tsx) once it resolves.
      (function () {
        try {
          var theme = localStorage.getItem('taskly.colorTheme')
          var font = localStorage.getItem('taskly.fontStyle')
          if (theme) document.documentElement.setAttribute('data-theme', theme)
          if (font) document.documentElement.setAttribute('data-font', font)
        } catch (e) { /* localStorage unavailable (private mode, etc.) — default theme applies */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
